services:
  postgres:
    image: postgres:16-alpine
    container_name: mercadhar_postgres
    environment:
      POSTGRES_DB: mercadhar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mercadhar_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./mercadhar  # Apunta a la carpeta de tu backend
    container_name: mercadhar-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mercadhar_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./mercadhar-frontend
    container_name: mercadhar-frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  postgres_data: